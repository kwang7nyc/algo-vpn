---
- name: Force local installation (this fork always installs to localhost)
  set_fact:
    cloud_instance_ip: >-
      {% if server is defined %}{{ server }}{% else %}localhost{% endif %}

- block:
    - pause:
        prompt: |
          What user should we use to login on the server? (note: passwordless login required, or ignore if you're deploying to localhost)
          [root]
      register: _algo_ssh_user
      when: ssh_user is undefined

    - name: Set the facts
      set_fact:
        ansible_ssh_user: >-
          {% if ssh_user is defined %}{{ ssh_user }}
          {%- elif _algo_ssh_user.user_input %}{{ _algo_ssh_user.user_input }}
          {%- else %}root{% endif %}
  when: cloud_instance_ip != "localhost"

- name: Detect the public IP address (used as the certificate's subject alt name)
  when: endpoint is undefined
  block:
    - name: Query Azure's instance metadata service
      uri:
        url: http://169.254.169.254/metadata/instance/network/interface/0/ipv4/ipAddress/0/publicIpAddress?api-version=2021-02-01
        headers:
          Metadata: "true"
        return_content: true
      register: _azure_imds_ip
  rescue:
    - name: Not running on Azure or IMDS unreachable -- fall back to a public IP lookup
      uri:
        url: https://api.ipify.org
        return_content: true
      register: _fallback_ip

- name: Set the facts
  set_fact:
    IP_subject_alt_name: >-
      {% if endpoint is defined %}{{ endpoint }}
      {%- elif _azure_imds_ip is defined and _azure_imds_ip.content is defined %}{{ _azure_imds_ip.content }}
      {%- else %}{{ _fallback_ip.content }}{% endif %}
