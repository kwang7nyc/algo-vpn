---
- name: Force local installation (this fork always installs to localhost)
  set_fact:
    cloud_instance_ip: >-
      {% if server is defined %}{{ server }}{% else %}localhost{% endif %}

- block:
    - pause:
        prompt: |
          What user should we use to login on the server? (note: passwordless login required, or ignore if you're deploying to localhost)
          [root]
      register: _algo_ssh_user
      when: ssh_user is undefined

    - name: Set the facts
      set_fact:
        ansible_ssh_user: >-
          {% if ssh_user is defined %}{{ ssh_user }}
          {%- elif _algo_ssh_user.user_input %}{{ _algo_ssh_user.user_input }}
          {%- else %}root{% endif %}
  when: cloud_instance_ip != "localhost"

- name: Detect the public IP address (used as the certificate's subject alt name)
  when: endpoint is undefined
  block:
    - name: Look up this host's public IP address
      # Azure's instance metadata service was tried here first, but its
      # network/interface/.../publicIpAddress leaf is unreliable for a
      # Standard-SKU public IP (empirically empty), and querying it without
      # format=text returns a JSON error body instead of failing cleanly --
      # which would otherwise flow straight into the cert's subject-alt-name.
      # A plain external lookup is simpler and was verified to work.
      uri:
        url: https://api.ipify.org
        return_content: true
      register: _detected_ip

    - name: Sanity-check the detected IP looks like an IPv4 address
      assert:
        that: _detected_ip.content is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: "public IP lookup returned something unexpected: {{ _detected_ip.content }}"

- name: Set the facts
  set_fact:
    IP_subject_alt_name: >-
      {% if endpoint is defined %}{{ endpoint }}
      {%- else %}{{ _detected_ip.content }}{% endif %}
